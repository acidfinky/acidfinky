<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alissa Kaina Fink</title>
<style>
:root{--bg:#fff;--ink:#000;--mute:#6b6b6b;--line:#d9d9d9}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1000px;margin:0 auto;padding:32px 24px 96px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px 40px;padding-bottom:20px;border-bottom:1px solid var(--ink)}
header .name{font-weight:700;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:6px 24px}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover,nav a[aria-current=page]{color:var(--ink);text-decoration:underline}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:56px 0 16px}
.intro{max-width:620px;margin:0 0 56px}
.type{font-family:"Courier New",Courier,monospace;font-size:14px;color:var(--mute)}
.item{display:grid;grid-template-columns:200px 1fr;gap:8px 40px;padding:28px 0;border-top:1px solid var(--line)}
.meta{padding-top:2px}
.item h2{font-size:18px;font-weight:700;margin:0 0 2px}
.role{margin:0 0 10px}
.item p{margin:0 0 10px;max-width:620px}
.links{margin-top:12px}
.links a{margin-right:20px}
.media{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
.media img,.media video{width:100%;height:auto;display:block}
.media .v{position:relative;aspect-ratio:16/9}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.home{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:24px 48px;margin-bottom:56px;align-items:start}
.home:not(:has(.pic)){grid-template-columns:1fr}
.pic{margin:0}
.pic img{width:100%;height:auto;display:block}
.pic figcaption{margin-top:8px;font-size:13px}
.bio p{margin:0 0 16px;max-width:620px}
.home-list{list-style:none;padding:0;margin:0}
.home-list li{border-top:1px solid var(--line)}
.home-list a{display:block;padding:14px 0;text-decoration:none;font-size:20px}
.home-list a:hover{text-decoration:underline}
footer{margin-top:80px;padding-top:16px;border-top:1px solid var(--line)}
@media(max-width:640px){.item,.home{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="name" href="#home">Alissa Kaina Fink</a>
  <nav id="nav" aria-label="Main"></nav>
</header>
<main id="main"></main>
<footer class="type" id="foot"></footer>
</div>

<script>
/* ============================================================
   EDIT THIS PART ONLY.
   - Change any text between the quotes.
   - Add photos:  images:["images/my-photo.jpg"]   (put the files in an "images" folder next to this file)
   - Add a video: video:"https://www.youtube.com/embed/VIDEO_ID"  or  video:"images/clip.mp4"
   - Add links:   links:[["Listen","https://..."],["Instagram","https://..."]]
   ============================================================ */
const SITE = {
  name: "Alissa Kaina Fink",
  email: "acidfinky@gmail.com",
  /* Press photo: put your file in the "images" folder and keep this name, or change it. Leave "" to hide. */
  photo: "images/press.jpg",
  photoCaption: "Photo: add credit here",
  bio: [
    "I'm Alissa Kaina Fink, a Paris-based sound artist, DJ and cultural producer performing as Acidfinky. With a background in Physics, I approach sound as both material and structure. My DJ sets and productions, which I describe as crispy sounds, combine heavy basslines, sharp drums and distinctive textures. I also work in sound design for commercial and audiovisual projects.",
    "Alongside my artistic practice, I work across event production, curation, radio, communications and education, with a focus on artist care and inclusive cultural spaces. I founded the independent label Twisting Knobs Records and Maison Sōt, an interdisciplinary series between Berlin and Cairo, and I currently work in PR and communications at Music Change Germany. Until September 2026 I was a curator at THF Radio and a member of the feminist collective BLVSH.",
    "Education and community work are an important part of my practice. I lead DJ, music production and radio workshops for young people, refugees and underrepresented genders in different cultural and international contexts. My work is shaped by an interest in migration, diversity and cross-cultural exchange."
  ]
};

const PAGES = [
 { id:"events", title:"Events & Production",
   intro:"Community-based and fundraising events, produced with attention to artist care and awareness.",
   items:[
   { date:"2026", place:"", title:"Intentional Listening", role:"Producer",
     text:["Produced three events around intentional listening."], links:[], images:[], video:"" },
   { date:"Jul 2024, Oct 2024, Apr 2025", place:"Berlin", title:"Solidarity Events", role:"Organiser & Producer",
     text:["Interdisciplinary fundraising events with international artists from the SWANA region.","Event planning, logistics, artist coordination, hospitality and artist care. Awareness-sensitive event concepts."],
     links:[], images:[], video:"" },
   { date:"Oct 2022", place:"Berlin", title:"BLVSH Exhibition", role:"Event production and on-site coordination",
     text:["Artist care and awareness-focused implementation. Funded by Musicboard Berlin."], links:[], images:[], video:"" },
   { date:"Aug – Sep 2022", place:"Berlin", title:"Creative Studios", role:"Program Coordinator",
     text:["Coordinated the radio mentoring program hosted by Refuge Worldwide in collaboration with Apple Creative Studios."], links:[], images:[], video:"" },
   { date:"Mar 2021", place:"Online", title:"COMMON Multiverse Initiative", role:"Curator",
     text:["Curated showcases for the digital festival COMMON on currents.fm."], links:[], images:[], video:"" }
 ]},
 { id:"platforms", title:"Platforms, Collectives & Label",
   intro:"Radio, collectives, and my own label and event series.",
   items:[
   { date:"2026 – present", place:"Berlin / Cairo", title:"Maison Sōt", role:"Founder",
     text:["An interdisciplinary series between Berlin and Cairo for music, art, food and workshops. Its first public event was a women-only Ableton Live workshop in Cairo with Dhamma, followed by an evening at arkaoda Berlin."], links:[], images:[], video:"" },
   { date:"Jan 2023 – present", place:"Berlin", title:"Twisting Knobs Records", role:"Founder",
     text:["Self-funded independent label."], links:[], images:[], video:"" },
   { date:"Jan 2021 – Sep 2026", place:"Berlin", title:"THF Radio", role:"Curator & Organiser (voluntary)",
     text:["Curatorial and organisational work at a community-based, diversity-focused radio station. Coordination with artists, collectives and community initiatives.","Vinyl DJ workshops for underrepresented genders and BIPOC individuals. Radio production workshops for minors with refugee background."], links:[], images:[], video:"" },
   { date:"Jun 2020 – Sep 2026", place:"Berlin", title:"BLVSH", role:"Event Producer & Organiser (voluntary)",
     text:["Events, workshops and radio broadcasts. Awareness work and safer spaces for women, trans and non-binary artists."], links:[], images:[], video:"" }
 ]},
 { id:"communication", title:"Press & Communication",
   intro:"Communication, press and video work for music organisations and labels.",
   items:[
   { date:"2026", place:"Berlin", title:"Low End Therapy Records", role:"Video editing and reels",
     text:["Video editing and short-form reels for the label."], links:[], images:[], video:"" },
   { date:"Apr 2025 – present", place:"Berlin", title:"Music Change Germany (previously Music Women* Germany)", role:"PR & Communications (paid)",
     text:["Responsible for all social media, including social media strategy. Video editing, website, editorial work and press.","Occasional workshop coordination."], links:[], images:[], video:"" }
 ]},
 { id:"teaching", title:"Workshops & Mentoring",
   intro:"Courses and workshops I teach, mostly for women, trans and non-binary people and young refugees.",
   items:[
   { date:"May 2026", place:"Berlin", title:"Open Music Lab / Hejmo", role:"Mentor. Supported by Ableton",
     text:["4-week beginner music production course using Ableton Live."], links:[], images:[], video:"" },
   { date:"Dec 2025 – Apr 2026", place:"Berlin", title:"Sound Sisters", role:"Mentor. Supported by SoundCloud",
     text:["Beginner DJ course for young female refugees (ages 13–21) living in Schöneberg."], links:[], images:[], video:"" },
   { date:"Dec 2025 – Jan 2026", place:"Cairo", title:"Maison Sōt x Dhamma", role:"Organiser and mentor. Supported by Ableton",
     text:["Beginner music production course for women based in Cairo."], links:[], images:[], video:"" },
   { date:"Nov 2025", place:"Riga", title:"Klik-Klak", role:"Mentor",
     text:["Introductory music production course using Ableton Live."], links:[], images:[], video:"" },
   { date:"Oct 2023", place:"Berlin", title:"Tag der Clubkultur", role:"Instructor",
     text:["Beginner vinyl DJ workshop."], links:[], images:[], video:"" },
   { date:"Apr – Oct 2022", place:"Berlin", title:"Refuge Worldwide", role:"Instructor",
     text:["Vinyl DJ workshops for women, trans and non-binary individuals at the Refuge Worldwide radio studios."], links:[], images:[], video:"" }
 ]},
 { id:"sound-design", title:"Sound Design",
   intro:"Commissioned sound design and original sound elements.",
   items:[
   { date:"May 2026", place:"", title:"NWNW x Hoka", role:"Sound Designer",
     text:["Sound design for social media video footage, with cousin cousin Filmproduktion."], links:[], images:[], video:"" },
   { date:"Oct 2025", place:"", title:"NWNW x Hoka", role:"Sound Designer",
     text:["Sound design for social media video content."], links:[], images:[], video:"" },
   { date:"Nov 2024", place:"", title:"Ableton", role:"Sound Designer",
     text:["Original sound elements for an official Ableton commercial campaign."], links:[], images:[], video:"" }
 ]},
 { id:"learning", title:"Programs & Learning",
   intro:"Programs and communities I took part in as a mentee or member.",
   items:[
   { date:"Feb – Jun 2026", place:"Berlin", title:"Low End Therapy Records", role:"Selected participant",
     text:["Artist development program, supported by Ableton and Refuge Worldwide."], links:[], images:[], video:"" },
   { date:"Apr 2023 – Apr 2024", place:"Online", title:"3024", role:"Mentee",
     text:["Music production mentoring program by the UK label 3024."], links:[], images:[], video:"" },
   { date:"May – Dec 2022", place:"Berlin", title:"Open Music Lab x Native Instruments", role:"Participant",
     text:["Music production mentoring program at Native Instruments' Germany headquarters."], links:[], images:[], video:"" },
   { date:"Dec 2020 – Dec 2023", place:"Berlin", title:"Éclat", role:"Member",
     text:["Production community and workspace for women, trans and non-binary individuals."], links:[], images:[], video:"" },
   { date:"Sep 2020 – Jan 2021", place:"Online", title:"Rhythm Sister", role:"Mentee",
     text:["UK-based music production program for women."], links:[], images:[], video:"" },
   { date:"Mar – Aug 2020", place:"Berlin", title:"SPOON", role:"Member",
     text:["Vinyl DJ community and workspace for women, trans and non-binary individuals."], links:[], images:[], video:"" }
 ]}
];

/* ============================================================
   Site code. No need to edit below.
   ============================================================ */
const $ = s => document.querySelector(s);
const nav = $("#nav"), main = $("#main");
nav.innerHTML = PAGES.map(p => `<a href="#${p.id}" data-id="${p.id}">${p.title}</a>`).join("") +
  `<a href="#contact" data-id="contact">Contact</a>`;
$("#foot").innerHTML = `${SITE.name}, Paris`;

function media(it){
  let h = (it.images||[]).map(s => `<img src="${s}" alt="${it.title}" loading="lazy">`).join("");
  if(it.video){
    h += /\.(mp4|webm)$/i.test(it.video)
      ? `<video src="${it.video}" controls preload="metadata"></video>`
      : `<div class="v"><iframe src="${it.video}" title="${it.title}" allowfullscreen loading="lazy"></iframe></div>`;
  }
  return h ? `<div class="media">${h}</div>` : "";
}
function item(it){
  const links = (it.links||[]).length ? `<div class="links">${it.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join("")}</div>` : "";
  return `<article class="item">
    <div class="meta type">${it.date}${it.place ? "<br>"+it.place : ""}</div>
    <div><h2>${it.title}</h2><p class="role type">${it.role}</p>
    ${it.text.map(t=>`<p>${t}</p>`).join("")}${links}${media(it)}</div></article>`;
}
function render(){
  const id = (location.hash || "#home").slice(1);
  const page = PAGES.find(p => p.id === id);
  nav.querySelectorAll("a").forEach(a => a.dataset.id === id ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if(page){
    document.title = `${page.title} – ${SITE.name}`;
    main.innerHTML = `<h1>${page.title}</h1><p class="intro">${page.intro}</p>${page.items.map(item).join("")}`;
  } else if(id === "contact"){
    document.title = `Contact – ${SITE.name}`;
    main.innerHTML = `<h1>Contact</h1><p class="intro"><a href="mailto:${SITE.email}">${SITE.email}</a></p>`;
  } else {
    document.title = SITE.name;
    const pic = SITE.photo ? `<figure class="pic"><img src="${SITE.photo}" alt="${SITE.name}" onerror="this.closest('figure').remove()"><figcaption class="type">${SITE.photoCaption||""}</figcaption></figure>` : "";
    main.innerHTML = `<h1>${SITE.name}</h1>
      <div class="home">${pic}<div class="bio">${SITE.bio.map(t=>`<p>${t}</p>`).join("")}</div></div>
      <ul class="home-list">${PAGES.map(p=>`<li><a href="#${p.id}">${p.title}</a></li>`).join("")}<li><a href="#contact">Contact</a></li></ul>`;
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
